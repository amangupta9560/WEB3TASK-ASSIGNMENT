<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <marker id="dfd-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="#f8fafc" />

  
  <rect x="0" y="0" width="960" height="52" fill="#0f172a" />
  <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16px" font-weight="700" fill="#ffffff">
    Data Flow Diagram (DFD Level 0): Context-Level Interaction
  </text>

  
  <circle cx="480" cy="285" r="95" fill="#ffffff" stroke="#ef4444" stroke-width="3" />
  <text x="480" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="14px" font-weight="800" fill="#991b1b" text-anchor="middle">0.0</text>
  <text x="480" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#0f172a" text-anchor="middle">SyncParty</text>
  <text x="480" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569" text-anchor="middle">Watch System</text>

  
  <rect x="40" y="90" width="170" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
  <text x="125" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#b45309" text-anchor="middle">👑 Host User</text>
  <text x="125" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#78350f" text-anchor="middle">Admin Authority</text>

  
  <rect x="40" y="380" width="170" height="80" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" />
  <text x="125" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#3730a3" text-anchor="middle">🛡️ Moderator User</text>
  <text x="125" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#312e81" text-anchor="middle">Playback Delegate</text>

  
  <rect x="750" y="380" width="170" height="80" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2" />
  <text x="835" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#065f46" text-anchor="middle">👤 Participant</text>
  <text x="835" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#047857" text-anchor="middle">Viewer / Joiner</text>

  
  <rect x="750" y="90" width="170" height="80" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2" />
  <text x="835" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#991b1b" text-anchor="middle">▶️ YouTube API</text>
  <text x="835" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#7f1d1d" text-anchor="middle">IFrame &amp; Streams</text>

  
  <rect x="390" y="70" width="180" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
  <text x="480" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#1e293b" text-anchor="middle">✉️ Nodemailer SMTP</text>
  <text x="480" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569" text-anchor="middle">Email Delivery Service</text>

  
  
  <line x1="210" y1="140" x2="410" y2="230" stroke="#0f172a" stroke-width="1.5" marker-end="url(#dfd-arrow)" />
  <text x="235" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#0f172a">Controls, Roles, Video IDs</text>

  
  <line x1="210" y1="410" x2="410" y2="340" stroke="#0f172a" stroke-width="1.5" marker-end="url(#dfd-arrow)" />
  <text x="240" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#0f172a">Play, Pause, Seek commands</text>

  
  <line x1="565" y1="330" x2="750" y2="400" stroke="#059669" stroke-width="1.5" marker-end="url(#dfd-arrow)" />
  <text x="590" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#059669">sync_state, roles, chat stream</text>

  
  <line x1="750" y1="430" x2="565" y2="350" stroke="#0f172a" stroke-width="1.5" marker-end="url(#dfd-arrow)" />
  <text x="600" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#0f172a">join_room, requests, reactions</text>

  
  <line x1="560" y1="230" x2="750" y2="140" stroke="#0f172a" stroke-width="1.5" marker-end="url(#dfd-arrow)" />
  <text x="610" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#0f172a">Video ID &amp; seek timestamp</text>

  
  <line x1="750" y1="160" x2="575" y2="245" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#dfd-arrow)" />
  <text x="630" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">Video buffer &amp; duration</text>

  
  <line x1="480" y1="190" x2="480" y2="120" stroke="#0f172a" stroke-width="1.5" marker-end="url(#dfd-arrow)" />
  <text x="490" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#0f172a">HTML email payload &amp; invite link</text>
</svg>
