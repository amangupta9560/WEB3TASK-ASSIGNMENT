<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <marker id="er-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
  </defs>

  <rect width="960" height="480" fill="#f8fafc" />

  
  <rect x="0" y="0" width="960" height="52" fill="#0f172a" />
  <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16px" font-weight="700" fill="#ffffff">
    Entity-Relationship Diagram (ERD): MongoDB Atlas Schemas
  </text>
  <text x="750" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12px" fill="#94a3b8">
    Mongoose ORM Models
  </text>

  
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="260" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="0" y="0" width="260" height="38" rx="10" fill="#fee2e2" />
    <text x="130" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14px" font-weight="700" fill="#991b1b" text-anchor="middle">User Model (users)</text>

    <line x1="0" y1="38" x2="260" y2="38" stroke="#cbd5e1" />
    <text x="14" y="62" font-family="monospace" font-size="11px" font-weight="700" fill="#dc2626">PK  _id: ObjectId</text>
    <text x="14" y="86" font-family="monospace" font-size="11px" fill="#0f172a">    name: String (required)</text>
    <text x="14" y="110" font-family="monospace" font-size="11px" font-weight="700" fill="#0284c7">UQ  email: String (unique)</text>
    <text x="14" y="134" font-family="monospace" font-size="11px" fill="#0f172a">    password: String (hash)</text>
    <text x="14" y="158" font-family="monospace" font-size="11px" fill="#0f172a">    avatar: String</text>
    <text x="14" y="182" font-family="monospace" font-size="11px" fill="#0f172a">    createdAt: Date</text>
    <text x="14" y="206" font-family="monospace" font-size="11px" fill="#0f172a">    updatedAt: Date</text>

    <line x1="0" y1="225" x2="260" y2="225" stroke="#cbd5e1" />
    <text x="14" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="600" fill="#475569">Methods / Hooks:</text>
    <text x="14" y="268" font-family="monospace" font-size="10px" fill="#64748b">• pre('save') ➔ bcrypt.hash()</text>
    <text x="14" y="286" font-family="monospace" font-size="10px" fill="#64748b">• comparePassword(candidate)</text>
    <text x="14" y="304" font-family="monospace" font-size="10px" fill="#64748b">• toJSON() ➔ strip password</text>
  </g>

  
  <line x1="300" y1="210" x2="360" y2="210" stroke="#0f172a" stroke-width="2" marker-end="url(#er-arrow)" />
  <text x="312" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="700" fill="#0f172a">1 : N</text>
  <text x="306" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">Hosts</text>

  
  <g transform="translate(360, 90)">
    <rect x="0" y="0" width="280" height="350" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="0" y="0" width="280" height="38" rx="10" fill="#e0e7ff" />
    <text x="140" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14px" font-weight="700" fill="#3730a3" text-anchor="middle">Room Model (rooms)</text>

    <line x1="0" y1="38" x2="280" y2="38" stroke="#cbd5e1" />
    <text x="14" y="62" font-family="monospace" font-size="11px" font-weight="700" fill="#dc2626">PK  _id: ObjectId</text>
    <text x="14" y="86" font-family="monospace" font-size="11px" font-weight="700" fill="#0284c7">UQ  roomId: String (unique code)</text>
    <text x="14" y="110" font-family="monospace" font-size="11px" fill="#0f172a">    title: String</text>
    <text x="14" y="134" font-family="monospace" font-size="11px" fill="#0f172a">    description: String</text>
    <text x="14" y="158" font-family="monospace" font-size="11px" font-weight="700" fill="#b45309">FK  host: ObjectId (User ref)</text>
    <text x="14" y="182" font-family="monospace" font-size="11px" fill="#0f172a">    hostUsername: String</text>
    <text x="14" y="206" font-family="monospace" font-size="11px" fill="#0f172a">    currentVideoId: String</text>
    <text x="14" y="230" font-family="monospace" font-size="11px" fill="#0f172a">    playState: 'playing'|'paused'</text>
    <text x="14" y="254" font-family="monospace" font-size="11px" fill="#0f172a">    currentTime: Number (secs)</text>
    <text x="14" y="278" font-family="monospace" font-size="11px" fill="#0f172a">    isPrivate: Boolean</text>
    <text x="14" y="302" font-family="monospace" font-size="11px" fill="#0f172a">    createdAt: Date</text>
    <text x="14" y="326" font-family="monospace" font-size="11px" fill="#0f172a">    updatedAt: Date</text>
  </g>

  
  <line x1="640" y1="210" x2="700" y2="210" stroke="#059669" stroke-width="2" marker-end="url(#er-arrow)" />
  <text x="650" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="700" fill="#059669">1 : N</text>
  <text x="646" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#047857">Embeds</text>

  
  <g transform="translate(700, 90)">
    <rect x="0" y="0" width="220" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="0" y="0" width="220" height="38" rx="10" fill="#d1fae5" />
    <text x="110" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#065f46" text-anchor="middle">Participant Schema</text>

    <line x1="0" y1="38" x2="220" y2="38" stroke="#cbd5e1" />
    <text x="14" y="62" font-family="monospace" font-size="11px" fill="#64748b">{ _id: false }</text>
    <text x="14" y="86" font-family="monospace" font-size="11px" fill="#0f172a">userId: String</text>
    <text x="14" y="110" font-family="monospace" font-size="11px" fill="#0f172a">username: String</text>
    <text x="14" y="134" font-family="monospace" font-size="11px" fill="#0f172a">role: Enum [</text>
    <text x="24" y="154" font-family="monospace" font-size="10px" fill="#b45309">'host',</text>
    <text x="24" y="172" font-family="monospace" font-size="10px" fill="#4338ca">'moderator',</text>
    <text x="24" y="190" font-family="monospace" font-size="10px" fill="#047857">'participant'</text>
    <text x="14" y="208" font-family="monospace" font-size="11px" fill="#0f172a">]</text>
    <text x="14" y="224" font-family="monospace" font-size="10px" fill="#64748b">joinedAt: Date</text>
  </g>
</svg>
