<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
    <marker id="flow-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="flow-arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="960" height="480" fill="#f8fafc" />

  
  <rect x="0" y="0" width="960" height="52" fill="#0f172a" />
  <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16px" font-weight="700" fill="#ffffff">
    WebSocket Event Lifecycle &amp; State Synchronization Pipeline
  </text>

  
  <rect x="30" y="80" width="170" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow2)" />
  <rect x="30" y="80" width="170" height="32" rx="10" fill="#fee2e2" />
  <text x="42" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#991b1b">1. Client Emit</text>
  <text x="42" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="600" fill="#0f172a">Action Triggered</text>
  <text x="42" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">play | pause | seek</text>
  <text x="42" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">change_video</text>
  <text x="42" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#64748b">socket.emit(event)</text>

  
  <line x1="200" y1="145" x2="250" y2="145" stroke="#0f172a" stroke-width="2" marker-end="url(#flow-arrow)" />

  
  <rect x="250" y="80" width="180" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow2)" />
  <rect x="250" y="80" width="180" height="32" rx="10" fill="#e0e7ff" />
  <text x="262" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#3730a3">2. Socket Gateway</text>
  <text x="262" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="600" fill="#0f172a">socketHandler.js</text>
  <text x="262" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Extract roomId &amp; socket.id</text>
  <text x="262" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Retrieve RoomSession</text>
  <text x="262" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#64748b">Identify user role</text>

  
  <line x1="430" y1="145" x2="480" y2="145" stroke="#0f172a" stroke-width="2" marker-end="url(#flow-arrow)" />

  
  <rect x="480" y="80" width="190" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow2)" />
  <rect x="480" y="80" width="190" height="32" rx="10" fill="#fef3c7" />
  <text x="492" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#92400e">3. Role Enforcement</text>
  <text x="492" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="600" fill="#0f172a">canControlPlayback()</text>
  <text x="492" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Host: Allowed ✅</text>
  <text x="492" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Moderator: Allowed ✅</text>
  <text x="492" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#dc2626">Participant: Denied ❌</text>

  
  <line x1="575" y1="210" x2="575" y2="280" stroke="#dc2626" stroke-width="2" marker-end="url(#flow-arrow-red)" />
  <text x="585" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#dc2626">Denied</text>

  
  <rect x="480" y="280" width="190" height="110" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2" />
  <text x="492" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#991b1b">Emit error_message</text>
  <text x="492" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#b91c1c">"Permission denied: Only</text>
  <text x="492" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#b91c1c">Host/Mod can control."</text>
  <text x="492" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#7f1d1d">Target socket only (no broadcast)</text>

  
  <line x1="670" y1="145" x2="720" y2="145" stroke="#059669" stroke-width="2" marker-end="url(#flow-arrow-green)" />
  <text x="674" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#059669">Allowed</text>

  
  <rect x="720" y="80" width="210" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow2)" />
  <rect x="720" y="80" width="210" height="32" rx="10" fill="#d1fae5" />
  <text x="732" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#065f46">4. State Transition</text>
  <text x="732" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="600" fill="#0f172a">RoomSession State</text>
  <text x="732" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">playState = 'playing'</text>
  <text x="732" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">lastUpdatedAt = Date.now()</text>
  <text x="732" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#047857">io.to(roomId).emit('sync_state')</text>

  
  <line x1="825" y1="210" x2="825" y2="280" stroke="#059669" stroke-width="2" marker-end="url(#flow-arrow-green)" />

  
  <rect x="720" y="280" width="210" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow2)" />
  <rect x="720" y="280" width="210" height="32" rx="10" fill="#e0e7ff" />
  <text x="732" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#3730a3">5. All Room Clients</text>
  <text x="732" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="600" fill="#0f172a">Receive sync_state</text>
  <text x="732" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">1. Set isSyncingRef = true</text>
  <text x="732" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">2. Drift check (&gt; 1.8s seek)</text>
  <text x="732" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">3. Call player.playVideo()</text>
  <text x="732" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#059669">4. Clear isSyncingRef (no echo!)</text>

  
  <rect x="250" y="280" width="180" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4,4" />
  <text x="264" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#334155">Async Persistence</text>
  <text x="264" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Room.updateOne()</text>
  <text x="264" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#64748b">MongoDB Atlas update</text>
  <text x="264" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#64748b">Non-blocking background sync</text>

  <line x1="720" y1="170" x2="430" y2="335" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#flow-arrow)" />
</svg>
