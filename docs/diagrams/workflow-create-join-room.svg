<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
    <marker id="wf-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="wf-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="960" height="520" fill="#f8fafc" />

  
  <rect x="0" y="0" width="960" height="52" fill="#0f172a" />
  <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16px" font-weight="700" fill="#ffffff">
    Workflow: Room Creation, URL Invitation, &amp; Participant Join
  </text>

  
  <rect x="30" y="75" width="900" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="30" y="75" width="220" height="30" rx="6" fill="#fee2e2" />
  <text x="45" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#991b1b">
    TRACK A: HOST ROOM CREATION
  </text>

  
  <rect x="50" y="125" width="160" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8" />
  <text x="62" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">A1. User Form</text>
  <text x="62" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Enter Title</text>
  <text x="62" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Enter YouTube URL</text>
  <text x="62" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Submit "Create Party"</text>

  <line x1="210" y1="180" x2="260" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#wf-arrow)" />

  
  <rect x="260" y="125" width="180" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8" />
  <text x="272" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">A2. POST /api/rooms</text>
  <text x="272" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Extract videoId (11-chars)</text>
  <text x="272" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Generate crypto code</text>
  <text x="272" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Save Room in MongoDB</text>

  <line x1="440" y1="180" x2="490" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#wf-arrow)" />

  
  <rect x="490" y="125" width="190" height="110" rx="8" fill="#fef3c7" stroke="#f59e0b" />
  <text x="502" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#b45309">A3. OOP RoomSession</text>
  <text x="502" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">roomManager registers</text>
  <text x="502" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">First user role = 'host'</text>
  <text x="502" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#047857">Full playback rights</text>

  <line x1="680" y1="180" x2="730" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#wf-arrow)" />

  
  <rect x="730" y="125" width="180" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8" />
  <text x="742" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">A4. Theater Route</text>
  <text x="742" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Navigate to /#room=id</text>
  <text x="742" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Mount YouTubePlayer</text>
  <text x="742" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#047857">Host controls enabled</text>

  
  <rect x="30" y="285" width="900" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="30" y="285" width="220" height="30" rx="6" fill="#d1fae5" />
  <text x="45" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#065f46">
    TRACK B: PARTICIPANT JOIN FLOW
  </text>

  
  <rect x="50" y="335" width="160" height="135" rx="8" fill="#f8fafc" stroke="#94a3b8" />
  <text x="62" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">B1. Entry Method</text>
  <text x="62" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• Click invite link</text>
  <text x="62" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• Click email invite</text>
  <text x="62" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• Input code on Home</text>
  <text x="62" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#64748b">Set guest name / login</text>

  <line x1="210" y1="400" x2="260" y2="400" stroke="#0f172a" stroke-width="2" marker-end="url(#wf-arrow)" />

  
  <rect x="260" y="335" width="180" height="135" rx="8" fill="#f8fafc" stroke="#94a3b8" />
  <text x="272" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">B2. Verification</text>
  <text x="272" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Check room existence</text>
  <text x="272" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#059669">Found: Connect Socket</text>
  <text x="272" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#dc2626">Not Found: Error Toast</text>
  <text x="272" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#64748b">Redirects back to Home</text>

  <line x1="440" y1="400" x2="490" y2="400" stroke="#059669" stroke-width="2" marker-end="url(#wf-green)" />

  
  <rect x="490" y="335" width="190" height="135" rx="8" fill="#f8fafc" stroke="#94a3b8" />
  <text x="502" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">B3. join_room Emit</text>
  <text x="502" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Server assigns role</text>
  <text x="502" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#047857">Default: 'participant'</text>
  <text x="502" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Server emits sync_state</text>
  <text x="502" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Server emits role_assigned</text>

  <line x1="680" y1="400" x2="730" y2="400" stroke="#0f172a" stroke-width="2" marker-end="url(#wf-arrow)" />

  
  <rect x="730" y="335" width="180" height="135" rx="8" fill="#d1fae5" stroke="#10b981" />
  <text x="742" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#065f46">B4. Synchronized View</text>
  <text x="742" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Loads current video</text>
  <text x="742" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Applies current timestamp</text>
  <text x="742" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Controls restricted</text>
  <text x="742" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#047857">Broadcasts user_joined</text>
</svg>
