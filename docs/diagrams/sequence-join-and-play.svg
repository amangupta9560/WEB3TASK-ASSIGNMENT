<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <marker id="sq-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
    <marker id="sq-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="sq-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <rect width="960" height="560" fill="#f8fafc" />

  
  <rect x="0" y="0" width="960" height="52" fill="#0f172a" />
  <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16px" font-weight="700" fill="#ffffff">
    Sequence Diagram: Join Room, RBAC Rejection, Role Promotion, &amp; Synchronized Play
  </text>

  
  
  <rect x="60" y="70" width="160" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
  <text x="92" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#b45309">Client A (👑 Host)</text>
  <line x1="140" y1="106" x2="140" y2="530" stroke="#94a3b8" stroke-dasharray="4,4" />

  
  <rect x="290" y="70" width="170" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
  <text x="312" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#047857">Client B (👤 Joiner)</text>
  <line x1="375" y1="106" x2="375" y2="530" stroke="#94a3b8" stroke-dasharray="4,4" />

  
  <rect x="530" y="70" width="170" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" />
  <text x="555" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#4338ca">⚡ Socket Gateway</text>
  <line x1="615" y1="106" x2="615" y2="530" stroke="#94a3b8" stroke-dasharray="4,4" />

  
  <rect x="760" y="70" width="160" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
  <text x="785" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#334155">🗄️ RoomSession</text>
  <line x1="840" y1="106" x2="840" y2="530" stroke="#94a3b8" stroke-dasharray="4,4" />

  
  <line x1="140" y1="130" x2="615" y2="130" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sq-arrow)" />
  <text x="210" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="600" fill="#0f172a">1. join_room { roomId, user: 'Host' }</text>

  <line x1="615" y1="145" x2="840" y2="145" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sq-arrow)" />
  <text x="650" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">addParticipant(role: 'host')</text>

  <line x1="615" y1="170" x2="140" y2="170" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#sq-green)" />
  <text x="230" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#059669">role_assigned ('host') &amp; sync_state</text>

  
  <line x1="375" y1="200" x2="615" y2="200" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sq-arrow)" />
  <text x="410" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="600" fill="#0f172a">2. join_room { roomId, user: 'Joiner' }</text>

  <line x1="615" y1="215" x2="840" y2="215" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sq-arrow)" />
  <text x="650" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">addParticipant(role: 'participant')</text>

  <line x1="615" y1="235" x2="375" y2="235" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#sq-green)" />
  <text x="420" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#059669">role_assigned ('participant') &amp; sync_state</text>

  <line x1="615" y1="255" x2="140" y2="255" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sq-arrow)" />
  <text x="240" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">user_joined broadcast { username: 'Joiner' }</text>

  
  <line x1="375" y1="290" x2="615" y2="290" stroke="#dc2626" stroke-width="1.5" marker-end="url(#sq-red)" />
  <text x="430" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="600" fill="#dc2626">3. play {} (Unauthorized Attempt)</text>

  <line x1="615" y1="305" x2="840" y2="305" stroke="#dc2626" stroke-width="1.5" marker-end="url(#sq-red)" />
  <text x="680" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#dc2626">canControlPlayback() ➔ false</text>

  <line x1="615" y1="325" x2="375" y2="325" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#sq-red)" />
  <text x="420" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#dc2626">error_message ("Permission denied")</text>

  
  <line x1="140" y1="360" x2="615" y2="360" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sq-arrow)" />
  <text x="210" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="600" fill="#0f172a">4. assign_role { userId: 'Joiner', role: 'moderator' }</text>

  <line x1="615" y1="375" x2="840" y2="375" stroke="#0f172a" stroke-width="1.5" marker-end="url(#sq-arrow)" />
  <text x="680" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">assignRole(target, 'moderator')</text>

  <line x1="615" y1="395" x2="140" y2="395" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#sq-arrow)" />
  <line x1="615" y1="410" x2="375" y2="410" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#sq-arrow)" />
  <text x="230" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#4f46e5">role_assigned ('moderator') broadcast to all</text>

  
  <line x1="375" y1="445" x2="615" y2="445" stroke="#059669" stroke-width="1.5" marker-end="url(#sq-green)" />
  <text x="420" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="600" fill="#059669">5. play {} (As Moderator)</text>

  <line x1="615" y1="460" x2="840" y2="460" stroke="#059669" stroke-width="1.5" marker-end="url(#sq-green)" />
  <text x="680" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#059669">canControlPlayback() ➔ true</text>

  
  <line x1="615" y1="485" x2="140" y2="485" stroke="#059669" stroke-width="1.5" marker-end="url(#sq-green)" />
  <line x1="615" y1="500" x2="375" y2="500" stroke="#059669" stroke-width="1.5" marker-end="url(#sq-green)" />
  <text x="230" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="700" fill="#059669">sync_state { playState: 'playing' } broadcast to room</text>
</svg>
