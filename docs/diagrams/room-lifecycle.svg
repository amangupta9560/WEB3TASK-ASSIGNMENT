<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <marker id="lc-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
    <marker id="lc-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="960" height="520" fill="#f8fafc" />

  
  <rect x="0" y="0" width="960" height="52" fill="#0f172a" />
  <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16px" font-weight="700" fill="#ffffff">
    Room &amp; Participant Lifecycle State Machine
  </text>

  
  <rect x="30" y="75" width="900" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="30" y="75" width="220" height="30" rx="6" fill="#fee2e2" />
  <text x="45" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#991b1b">
    A. ROOM STATE LIFECYCLE
  </text>

  
  <circle cx="70" cy="180" r="14" fill="#0f172a" />
  <circle cx="70" cy="180" r="10" fill="#ffffff" />
  <line x1="84" y1="180" x2="130" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#lc-arrow)" />

  <rect x="130" y="135" width="140" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
  <text x="145" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#b45309">CREATED</text>
  <text x="145" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• RoomSession initialized</text>
  <text x="145" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Creator becomes Host</text>
  <text x="145" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Default video loaded</text>

  <line x1="270" y1="180" x2="330" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#lc-arrow)" />
  <text x="278" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="9px" fill="#475569">join_room</text>

  
  <rect x="330" y="135" width="160" height="90" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
  <text x="345" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#065f46">ACTIVE SYNCING</text>
  <text x="345" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• play / pause / seek</text>
  <text x="345" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• sync_state broadcast</text>
  <text x="345" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Chat &amp; reactions live</text>

  <line x1="490" y1="180" x2="550" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#lc-arrow)" />
  <text x="495" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="9px" fill="#475569">host leaves</text>

  
  <rect x="550" y="135" width="160" height="90" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" />
  <text x="565" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#3730a3">HOST REASSIGNMENT</text>
  <text x="565" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Next user auto-promoted</text>
  <text x="565" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Or explicit transfer_host</text>
  <text x="565" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Session continues</text>

  
  <path d="M 630 135 C 630 110, 410 110, 410 135" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#lc-arrow)" />
  <text x="480" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="9px" fill="#6366f1">New Host Active</text>

  <line x1="710" y1="180" x2="770" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#lc-red)" />
  <text x="715" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="9px" fill="#dc2626">participants = 0</text>

  
  <rect x="770" y="135" width="130" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
  <text x="785" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#334155">EMPTY / CACHED</text>
  <text x="785" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Sockets empty</text>
  <text x="785" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Persists in DB</text>
  <text x="785" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Rejoinable by code</text>

  
  <rect x="30" y="300" width="900" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="30" y="300" width="220" height="30" rx="6" fill="#e0e7ff" />
  <text x="45" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#3730a3">
    B. PARTICIPANT ROLE TRANSITIONS
  </text>

  
  <rect x="70" y="355" width="180" height="110" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
  <text x="85" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#065f46">👤 PARTICIPANT</text>
  <text x="85" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Default role upon join</text>
  <text x="85" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Watch only (controls locked)</text>
  <text x="85" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Can request action approval</text>

  
  <line x1="250" y1="410" x2="340" y2="410" stroke="#6366f1" stroke-width="2" marker-end="url(#lc-arrow)" />
  <text x="256" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="9px" fill="#6366f1">assign_role ('moderator')</text>

  
  <rect x="340" y="355" width="190" height="110" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" />
  <text x="355" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#3730a3">🛡️ MODERATOR</text>
  <text x="355" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Play/pause unlocked</text>
  <text x="355" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Seek scrub unlocked</text>
  <text x="355" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Change video unlocked</text>

  
  <path d="M 435 465 C 435 485, 160 485, 160 465" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#lc-arrow)" />
  <text x="230" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="9px" fill="#64748b">Demote to participant</text>

  
  <line x1="530" y1="410" x2="620" y2="410" stroke="#f59e0b" stroke-width="2" marker-end="url(#lc-arrow)" />
  <text x="536" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="9px" fill="#b45309">transfer_host</text>

  
  <rect x="620" y="355" width="160" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
  <text x="635" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#b45309">👑 HOST</text>
  <text x="635" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Full room admin</text>
  <text x="635" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Promote / kick users</text>
  <text x="635" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#475569">• Immutable authority</text>

  
  <line x1="160" y1="355" x2="160" y2="330" stroke="#dc2626" stroke-width="1.5" />
  <line x1="160" y1="330" x2="840" y2="330" stroke="#dc2626" stroke-width="1.5" />
  <line x1="840" y1="330" x2="840" y2="355" stroke="#dc2626" stroke-width="1.5" marker-end="url(#lc-red)" />
  <text x="440" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="9px" fill="#dc2626">remove_participant (Kick action)</text>

  <rect x="800" y="355" width="110" height="110" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
  <text x="812" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#991b1b">REMOVED</text>
  <text x="812" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#b91c1c">• Socket kicked</text>
  <text x="812" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#b91c1c">• Alert displayed</text>
  <text x="812" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#b91c1c">• Redirected home</text>
</svg>
