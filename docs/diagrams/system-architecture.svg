  <text x="738" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#0f172a">MongoDB Atlas</text>
  <text x="738" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12px" fill="#475569">User collection</text>
  <text x="738" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12px" fill="#475569">Room state collection</text>

  <rect x="726" y="236" width="188" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="738" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#0f172a">YouTube CDN</text>
  <text x="738" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12px" fill="#475569">IFrame API Scripts</text>
  <text x="738" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="12px" fill="#475569">Video stream delivery</text>

  <rect x="726" y="332" width="188" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="738" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#0f172a">Nodemailer SMTP</text>
  <text x="738" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="12px" fill="#475569">Gmail Transport</text>
  <text x="738" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#64748b">Room invite delivery</text>

  <rect x="726" y="424" width="188" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="738" y="448" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#0f172a">Cloudinary</text>
  <text x="738" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="12px" fill="#475569">Media storage config</text>
  <text x="738" y="486" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#64748b">Profile assets</text>

  
  
  <line x1="300" y1="260" x2="350" y2="260" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" />
  <line x1="350" y1="275" x2="300" y2="275" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="306" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="700" fill="#dc2626">WebSocket</text>
  <text x="312" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="700" fill="#4f46e5">Sync</text>

  
  <line x1="300" y1="365" x2="350" y2="365" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="310" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="700" fill="#475569">REST API</text>

  
  <line x1="660" y1="180" x2="710" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="668" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="700" fill="#475569">Mongoose</text>

  
  <line x1="660" y1="370" x2="710" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="672" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="10px" font-weight="700" fill="#475569">SMTP</text>
