<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <marker id="dep-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="#f8fafc" />

  
  <rect x="0" y="0" width="960" height="52" fill="#0f172a" />
  <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16px" font-weight="700" fill="#ffffff">
    Production Cloud Deployment &amp; Infrastructure Topology
  </text>

  
  <rect x="30" y="80" width="220" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="30" y="80" width="220" height="35" rx="12" fill="#f1f5f9" />
  <text x="45" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#1e293b">
    CLIENT DEVICES
  </text>

  <rect x="45" y="130" width="190" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="55" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">Desktop Browsers</text>
  <text x="55" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Chrome, Firefox, Safari</text>
  <text x="55" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Edge (WebSockets + HTML5)</text>
  <text x="55" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#059669">YouTube IFrame Engine</text>

  <rect x="45" y="245" width="190" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="55" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">Mobile Viewports</text>
  <text x="55" y="287" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">iOS Safari &amp; Android</text>
  <text x="55" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Responsive Tailwind tabs</text>
  <text x="55" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#059669">Touch-optimized controls</text>

  <rect x="45" y="360" width="190" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5" />
  <text x="55" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#991b1b">Transport Protocols</text>
  <text x="55" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="600" fill="#dc2626">• WSS (Secure WebSocket)</text>
  <text x="55" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="600" fill="#4f46e5">• HTTPS (REST Calls)</text>
  <text x="55" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• TLS 1.3 Encryption</text>
  <text x="55" y="456" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#64748b">Prevents mixed-content errors</text>

  
  <rect x="330" y="80" width="280" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="330" y="80" width="280" height="35" rx="12" fill="#fee2e2" />
  <text x="345" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#991b1b">
    FRONTEND HOST: VERCEL
  </text>
  <text x="345" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="600" fill="#0f172a">Edge CDN &amp; Static Hosting</text>
  <text x="345" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• Build Command: npm run build</text>
  <text x="345" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• Output Directory: dist/</text>
  <text x="345" y="191" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• SPA Rewrites: /.* ➔ index.html</text>
  <text x="345" y="209" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• Global Anycast DNS caching</text>
  <text x="345" y="227" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#059669">• Auto-SSL certificate (Let's Encrypt)</text>
  <text x="345" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#991b1b">Note: Serverless does NOT host WS server</text>

  
  <rect x="330" y="300" width="280" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="330" y="300" width="280" height="35" rx="12" fill="#e0e7ff" />
  <text x="345" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#3730a3">
    BACKEND HOST: RENDER / RAILWAY
  </text>
  <text x="345" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="600" fill="#0f172a">Persistent Web Service Instance</text>
  <text x="345" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• Runtime: Node.js 20+ (Express 4)</text>
  <text x="345" y="393" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• Start Command: node index.js</text>
  <text x="345" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="11px" font-weight="600" fill="#3730a3">• Persistent TCP WebSocket gateway</text>
  <text x="345" y="429" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• In-Memory RoomSession coordinator</text>
  <text x="345" y="447" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• Health Check: GET /api/health</text>
  <text x="345" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#059669">• CORS allowed origin: Vercel domain</text>

  
  <rect x="680" y="80" width="250" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="680" y="80" width="250" height="35" rx="12" fill="#d1fae5" />
  <text x="695" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#065f46">
    MANAGED CLOUD SERVICES
  </text>

  <rect x="695" y="130" width="220" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="705" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">MongoDB Atlas (DBaaS)</text>
  <text x="705" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">3-Shard Replica Set</text>
  <text x="705" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Automatic SSL TLS encryption</text>
  <text x="705" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Persistent rooms &amp; users</text>

  <rect x="695" y="245" width="220" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="705" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">Google Gmail SMTP</text>
  <text x="705" y="287" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Port 587 (TLS / STARTTLS)</text>
  <text x="705" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Dispatches Nodemailer HTML</text>
  <text x="705" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Direct room invitation links</text>

  <rect x="695" y="360" width="220" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="705" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">Cloudinary CDN</text>
  <text x="705" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Global media distribution</text>
  <text x="705" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">User avatars &amp; thumbnails</text>
  <text x="705" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">API Key / Secret auth</text>

  
  
  <line x1="250" y1="180" x2="330" y2="180" stroke="#0f172a" stroke-width="1.5" marker-end="url(#dep-arrow)" />
  <text x="260" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#0f172a">HTTPS (Assets)</text>

  
  <line x1="250" y1="400" x2="330" y2="400" stroke="#0f172a" stroke-width="1.5" marker-end="url(#dep-arrow)" />
  <text x="256" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#0f172a">WSS / REST</text>

  
  <line x1="610" y1="350" x2="695" y2="200" stroke="#0f172a" stroke-width="1.5" marker-end="url(#dep-arrow)" />
  <text x="620" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#0f172a">Mongoose</text>

  
  <line x1="610" y1="380" x2="695" y2="300" stroke="#0f172a" stroke-width="1.5" marker-end="url(#dep-arrow)" />
  <text x="630" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#0f172a">SMTP</text>
</svg>
