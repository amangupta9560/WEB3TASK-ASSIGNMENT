<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <marker id="ps-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
    <marker id="ps-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="ps-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <rect width="960" height="520" fill="#f8fafc" />

  
  <rect x="0" y="0" width="960" height="52" fill="#0f172a" />
  <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16px" font-weight="700" fill="#ffffff">
    Workflow: Playback Synchronization &amp; Echo-Loop Elimination
  </text>

  
  <rect x="30" y="80" width="230" height="400" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="30" y="80" width="230" height="35" rx="12" fill="#fee2e2" />
  <text x="45" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#991b1b">
    1. INITIATING ACTION
  </text>

  <rect x="45" y="130" width="200" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="55" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">Host / Moderator (Allowed)</text>
  <text x="55" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• Click Play / Pause</text>
  <text x="55" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• Drag seek slider to Xs</text>
  <text x="55" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• Input new YouTube URL</text>

  <rect x="45" y="235" width="200" height="85" rx="8" fill="#fef2f2" stroke="#fca5a5" />
  <text x="55" y="257" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#991b1b">Participant (Restricted)</text>
  <text x="55" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#b91c1c">• Controls disabled in UI</text>
  <text x="55" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#b91c1c">• If bypassed: emits event</text>
  <text x="55" y="311" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#b91c1c">• Can "Request Action"</text>

  <rect x="45" y="340" width="200" height="120" rx="8" fill="#e0e7ff" stroke="#a5b4fc" />
  <text x="55" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#3730a3">Late Joiner Connection</text>
  <text x="55" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#4338ca">• Joins midway in party</text>
  <text x="55" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#4338ca">• Emits join_room</text>
  <text x="55" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#4338ca">• Server computes drift:</text>
  <text x="55" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="10px" fill="#312e81">time + (now - lastUpdate)/1000</text>
  <text x="55" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#059669">➔ Jumps right to current pos</text>

  
  <rect x="310" y="80" width="290" height="400" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="310" y="80" width="290" height="35" rx="12" fill="#fef3c7" />
  <text x="325" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#92400e">
    2. SERVER AUTHORIZATION &amp; STATE
  </text>

  <rect x="325" y="130" width="260" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="335" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">Security Verification</text>
  <text x="335" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Look up socketId in RoomSession</text>
  <text x="335" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#059669">If Host/Mod: execute state update</text>
  <text x="335" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#dc2626">If Participant: emit error_message</text>

  <rect x="325" y="235" width="260" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="335" y="257" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">RoomSession State Transition</text>
  <text x="335" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• playState: 'playing' | 'paused'</text>
  <text x="335" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• currentTime: seekTargetSecs</text>
  <text x="335" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• currentVideoId: newVideoId</text>
  <text x="335" y="331" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">• lastUpdatedAt: Date.now()</text>

  <rect x="325" y="360" width="260" height="100" rx="8" fill="#d1fae5" stroke="#10b981" />
  <text x="335" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#065f46">Broadcast to Room Channel</text>
  <text x="335" y="402" font-family="monospace" font-size="11px" fill="#047857">io.to(roomId).emit('sync_state', {</text>
  <text x="345" y="420" font-family="monospace" font-size="11px" fill="#047857">  videoId, playState, currentTime</text>
  <text x="335" y="438" font-family="monospace" font-size="11px" fill="#047857">})</text>

  
  <rect x="650" y="80" width="280" height="400" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="650" y="80" width="280" height="35" rx="12" fill="#e0e7ff" />
  <text x="665" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="13px" font-weight="700" fill="#3730a3">
    3. CLIENT YOUTUBE ENGINE
  </text>

  <rect x="665" y="130" width="250" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="675" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">Step A: Set Loop-Guard</text>
  <text x="675" y="172" font-family="monospace" font-size="11px" fill="#dc2626">isSyncingRef.current = true;</text>
  <text x="675" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Blocks local onStateChange from</text>
  <text x="675" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">firing another event to the server!</text>

  <rect x="665" y="245" width="250" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="675" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">Step B: Drift &amp; Playback Sync</text>
  <text x="675" y="287" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">if (|currentPos - time| &gt; 1.8s) {</text>
  <text x="685" y="305" font-family="monospace" font-size="11px" fill="#047857">player.seekTo(time, true);</text>
  <text x="675" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">}</text>
  <text x="675" y="341" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Apply playVideo() or pauseVideo()</text>

  <rect x="665" y="370" width="250" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="675" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="700" fill="#0f172a">Step C: Release Guard</text>
  <text x="675" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">After 500ms timeout:</text>
  <text x="675" y="432" font-family="monospace" font-size="11px" fill="#059669">isSyncingRef.current = false;</text>
  <text x="675" y="448" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#475569">Loop completely eliminated! ✅</text>

  
  <line x1="260" y1="170" x2="310" y2="170" stroke="#059669" stroke-width="2" marker-end="url(#ps-green)" />
  <line x1="260" y1="275" x2="310" y2="275" stroke="#dc2626" stroke-width="2" marker-end="url(#ps-red)" />
  <line x1="600" y1="410" x2="650" y2="410" stroke="#0f172a" stroke-width="2" marker-end="url(#ps-arrow)" />
</svg>
